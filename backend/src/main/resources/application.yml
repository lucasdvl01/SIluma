spring:
  application:
    name: iluminacao-minas-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: dG9ycmVzLWlsdW1pbmFjYW8tbWluYXMtMjAyNC1zZWNyZXQta2V5LXNlbmFpLWJldGltLXJvYnVzdC1qd3Qta2V5LTU1Y2E=
  expiration: 86400000 # 24 horas em milissegundos

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.senai.iluminacaominas: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# Perfil DEV (H2 em arquivo persistente local ou memória)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./h2_data/minasdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

---
# Perfil DOCKER / PROD (MySQL 8.x)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:iluminacao_minas}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
